<!DOCTYPE html>
<html>
  <head><base target="_top"></head>
  <body style="font-family: sans-serif;">
    <h2>Invoices</h2>
    <table id="invoiceTable" border="1" cellpadding="4">
      <thead><tr><th>ID</th><th>Amount</th></tr></thead>
      <tbody id="invoiceRows"><tr><td colspan="2">loading...</td></tr></tbody>
    </table>

    <h3>Submit an invoice</h3>
    <input id="amount" type="number" placeholder="amount" />
    <button onclick="submitInvoice()">Submit</button>
    <div id="submitResult"></div>

    <div id="approveSection" style="display:none;">
      <h3>Approve an invoice</h3>
      <input id="approveId" type="text" placeholder="invoice id" />
      <button onclick="approveInvoice()">Approve</button>
      <div id="approveResult"></div>
    </div>

    <script>
      function dispatch(name, ...args) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .__rbacDispatch(name, ...args);
        });
      }

      function renderInvoices(invoices) {
        document.getElementById('invoiceRows').innerHTML = invoices
          .map((inv) => `<tr><td>${inv.id}</td><td>${inv.amount}</td></tr>`)
          .join('');
      }

      // permissionsFor() drives what's shown -- cosmetic only, the real gate
      // is the permission check inside approveInvoice's own route.
      dispatch('whoAmI').then((r) => {
        if (r.perms.includes('invoice:approve')) {
          document.getElementById('approveSection').style.display = 'block';
        }
      });

      dispatch('listInvoices')
        .then(renderInvoices)
        .catch((e) => (document.getElementById('invoiceRows').innerHTML = `<tr><td colspan="2">${e.message}</td></tr>`));

      function submitInvoice() {
        const amount = Number(document.getElementById('amount').value);
        dispatch('submitInvoice', amount)
          .then((inv) => {
            document.getElementById('submitResult').textContent = `submitted ${inv.id}`;
            return dispatch('listInvoices');
          })
          .then(renderInvoices)
          .catch((e) => (document.getElementById('submitResult').textContent = e.message));
      }

      function approveInvoice() {
        const id = document.getElementById('approveId').value;
        dispatch('approveInvoice', id)
          .then((inv) => (document.getElementById('approveResult').textContent = `approved ${inv.id}`))
          .catch((e) => (document.getElementById('approveResult').textContent = e.message));
      }
    </script>
  </body>
</html>
